<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Arvor Linux Repositories</title>
<style>
  body { 
    font-family: Consolas, "Courier New", monospace; 
    background: #f5f5f5; 
    color: #333; 
    padding: 20px; 
    margin: 0;
    min-height: 100vh;
    box-sizing: border-box;
    padding-bottom: 80px;
  }
  .header { display: flex; align-items: center; margin-bottom: 20px; }
  .logo { height: 50px; width: auto; margin-right: 15px; }
  h1 { font-size: 24px; margin: 0; }
  ul { list-style: none; padding-left: 0; }
  li { margin: 5px 0; display: flex; align-items: center; }
  a { text-decoration: none; color: #0366d6; }
  a:hover { text-decoration: underline; }
  .folder::before { content: "📁 "; margin-right: 5px; }
  .file::before { content: "📄 "; margin-right: 5px; }
  .deb::before { content: "📦 "; margin-right: 5px; }
  #path { margin-bottom: 10px; font-weight: bold; }
  .size { margin-left: 20px; color: #666; font-size: 0.9em; }
  
  footer { 
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background: #333;
    color: #00ff00;
    padding: 10px 20px;
    font-size: 0.9em;
    font-weight: bold;
    border-top: 2px solid #555;
    box-sizing: border-box;
    z-index: 1000;
    display: flex;
    justify-content: space-between;
  }
</style>
</head>
<body>

<div class="header">
  <img src="arv.png" alt="Logo" class="logo">
  <h1 id="pageTitle">Index of TheArvorIndex/</h1>
</div>

<ul id="fileList">
  <li class="folder">
    <a href="https://thearvorindex.github.io/repo-arvorlinux-1">Repository 1/</a>
  </li>
</ul>

<footer>
  <span>[ STATUS: ONLINE ]</span>
  <span>Running on GitHub Pages | Image: ubuntu-latest</span>
</footer>

</body>
</html>
